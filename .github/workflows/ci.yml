name: ci

# The merge gate. Everything that must be true before code reaches `main`
# runs here; `pages.yml` deploys only after this workflow succeeds.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Supersede in-flight PR runs; never cancel a `main` run, because the Pages
# deploy is chained to its conclusion.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The cheapest gate, so it is the one that fails first: Biome checks 419
  # files in ~0.2s. Separate job, no `needs:` — a lint error should be visible
  # without waiting for a 20-minute build+test matrix, and a build failure
  # should not hide a lint failure.
  #
  # `pnpm lint` fails on ERRORS only. Biome's `warn` rules are the debt list in
  # biome.jsonc; they print here and never block. Do not add
  # `--error-on-warnings` until that list is empty.
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  # Job names are contract: they are what branch protection requires and what
  # `pages.yml` waits on. `verify` and `e2e` must keep their names. A new gate
  # (the visual-correctness browser suite) slots in as a THIRD job here with
  # `needs: verify`, beside `e2e` rather than after it — the two are
  # independent and should fail independently.
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write # the coverage summary comment, below
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm # caches the pnpm store, keyed on pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile

      # Typecheck is not a separate step on purpose: every package's `build`
      # IS `tsc -p tsconfig.json`, and `next build` typechecks `apps/web`.
      # A standalone `tsc --noEmit` pass would compile the same sources twice
      # for the same diagnostics.
      - name: Build (typechecks all packages + static export)
        run: pnpm -r build

      # Dual-mode drift is invisible unless both builds run (FRONTEND.md 6.5).
      # The static export above has no API surface at all; this one compiles
      # the `route.api.ts` handlers.
      #
      # It runs BEFORE the tests on purpose: `apps/web/test/bundleSecrecy.test.ts`
      # greps the BUILT client assets of BOTH modes for operational answer-key
      # material, and it can only do that if both outputs exist. The static
      # export lands in `apps/web/out`, the hosted client chunks in
      # `apps/web/.next/static` — so this step must be the one that leaves
      # `.next` behind.
      - name: Build server mode (AILX_BACKEND=1)
        env:
          AILX_BACKEND: "1"
        run: pnpm --filter @ailx/web build

      # ONE vitest for every package (vitest-workspace.ts). The hosted runner
      # has more cores than the 4-fork laptop default, and no other work to do
      # with them.
      #
      # `test:coverage` is the same run with v8 instrumentation: measured at
      # +1.6s on a ~26s suite, so CI pays for it and the local `pnpm test` loop
      # stays untouched. No coverage threshold gates this — see
      # vitest.config.ts and FRONTEND.md 7.2.
      - name: Test (with coverage)
        env:
          AILX_TEST_FORKS: "8"
        run: pnpm test:coverage

      # The report a reviewer actually reads, rendered from coverage/ by the
      # workflow token alone: no third-party account, no secret, works the day
      # this merges. Skipped on fork PRs, whose token cannot comment.
      - name: Comment coverage on the PR
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          json-summary-path: coverage/coverage-summary.json
          json-final-path: coverage/coverage-final.json

      # Codecov adds the README badge and the trend line the comment cannot.
      # Never fatal: a rate-limited tokenless upload must not fail a green
      # build. Add CODECOV_TOKEN in repo secrets to make uploads reliable.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  e2e:
    name: e2e
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The suite drives the FRONTEND against the real exam service. This app has
    # no API routes of its own any more (docs/ARCHITECTURE.md §10.1 step 3), and
    # `services/api` lives in the PRIVATE ailx-backend repository, which this
    # workflow cannot check out. So there is no Postgres here and no schema to
    # bootstrap: the service owns both.
    #
    # Set the repository variable `AILX_E2E_API_BASE` to a service this workflow
    # may write to — a THROW-AWAY one, never staging, because every spec appends
    # rows. Unset, the job is a documented skip rather than a red gate nobody in
    # this repository can fix. The same specs DO run on every change to the
    # service: ailx-backend's CI checks this repo out and runs them against a
    # freshly booted `services/api`.
    env:
      AILX_E2E_API_BASE: ${{ vars.AILX_E2E_API_BASE }}
    steps:
      - uses: actions/checkout@v4

      - id: suite
        name: Detect the suite and its exam service
        run: |
          if [ ! -f apps/web/playwright.config.ts ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::apps/web/playwright.config.ts not present — skipping E2E."
          elif [ -z "$AILX_E2E_API_BASE" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::AILX_E2E_API_BASE is not set, so there is no exam service to drive. Skipping E2E. The same specs run in ailx-backend CI against a freshly booted services/api."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.suite.outputs.present == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.suite.outputs.present == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - if: steps.suite.outputs.present == 'true'
        run: pnpm install --frozen-lockfile

      # Playwright's `webServer` runs `next build` itself, so only the
      # workspace packages `apps/web` imports need building here.
      - if: steps.suite.outputs.present == 'true'
        name: Build workspace packages
        run: pnpm -r --filter '!@ailx/web' build

      - if: steps.suite.outputs.present == 'true'
        name: Install Chromium
        run: pnpm --filter @ailx/web exec playwright install --with-deps chromium

      - if: steps.suite.outputs.present == 'true'
        name: Run Playwright
        run: pnpm --filter @ailx/web e2e

      - if: always() && steps.suite.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7
          if-no-files-found: ignore
