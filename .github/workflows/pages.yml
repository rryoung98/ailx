name: pages

# Deploy the GitHub Pages redirect to foray.tenken.co.
#
# The static demo used to be built and served here. The canonical home is now
# https://foray.tenken.co (the Vercel hosted build), and every path under
# /ailx/ redirects there, preserving the sub-path. The redirect is two HTML
# files: index.html for /ailx/ and 404.html for everything else (GitHub Pages
# serves 404.html for any path it cannot match).
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.rev.outputs.sha }}
    steps:
      - id: rev
        run: echo "sha=${{ github.event.workflow_run.head_sha || github.sha }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.rev.outputs.sha }}
      - name: Prepare redirect site
        run: |
          mkdir -p _site
          cp apps/web/redirect/index.html _site/index.html
          cp apps/web/redirect/404.html   _site/404.html
          touch _site/.nojekyll
          printf '{"sha":"%s","ref":"%s","runId":"%s","builtAt":"%s"}\n' \
            "${{ steps.rev.outputs.sha }}" "${{ github.ref_name }}" \
            "${{ github.run_id }}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > _site/version.json
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  tag:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.build.outputs.sha }}
      - name: Tag the deployed commit
        run: |
          tag="build-$(date -u +%Y.%m.%d)-$(git rev-parse --short=7 HEAD)"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "::notice::$tag already exists — nothing to tag."
            exit 0
          fi
          git tag "$tag"
          git push origin "$tag"
          echo "::notice::tagged $tag"
