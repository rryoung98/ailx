# T1 · Creative Build — score allocation per spec §T1 (100 pts)
track: t1-creative-build
total_points: 100
criteria:
  - id: functional-gates
    name: Functional & accessibility gates
    points: 30
    scored_by: gates              # machine-checkable; VLM screening confined to objective checks
    judged: false
    description: >-
      Renders without console error; responsive at three viewports; WCAG AA
      contrast on all text; semantic landmarks; keyboard-navigable; performance
      budget met; all required brief elements present.
  - id: comparative-merit
    name: Comparative visual merit
    points: 40
    scored_by: pairwise-human     # blinded forced-choice, Bradley–Terry, style covariates partialled out
    judged: false
    description: >-
      Blinded forced-choice pairwise comparison by the full cohort, fitted with
      Bayesian Bradley–Terry with tie parameter, style covariates partialled out.
  - id: technical-ambition
    name: Technical ambition
    points: 20
    scored_by: detector-plus-judge
    judged: true                  # judge confirms purposeful vs decorative
    description: >-
      WebGL / Three.js, canvas work, custom shaders, non-trivial interaction —
      detected objectively, then confirmed by judge as purposeful rather than
      decorative.
  - id: design-rationale
    name: Design rationale
    points: 10
    scored_by: judge
    judged: true
    description: >-
      200-word statement of intent plus prompt log; scored on the coherence
      between stated intent and delivered artefact.
band_anchors:
  # Track-level anchor descriptors aligned to the composite bands of §04.
  - band: distinction
    min_scaled: 70
    anchor: >-
      All gates pass; site wins a clear majority of blinded pairwise comparisons;
      technical work is purposeful and integrated; rationale and artefact cohere.
  - band: merit
    min_scaled: 61
    anchor: >-
      All or nearly all gates pass; above-median comparative merit; some
      purposeful technical ambition; rationale mostly coherent.
  - band: pass
    min_scaled: 50
    anchor: >-
      Core gates pass; median comparative standing; limited but functional
      technical scope; rationale present.
  - band: participation
    min_scaled: 0
    anchor: >-
      Submission received and rendered; gate failures or below-median
      comparative standing; diagnostic report issued.
