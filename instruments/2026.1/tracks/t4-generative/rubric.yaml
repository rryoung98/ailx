# T4 · Generative Direction — score allocation per spec §T4 (100 pts)
track: t4-generative
total_points: 100
criteria:
  - id: brief-compliance
    name: Brief compliance & communicative accuracy
    points: 30
    scored_by: blind-panel-agreement
    judged: false
    description: >-
      Blind viewers are shown the output without the brief and asked what it
      communicates; the score is agreement with the brief's stated intent.
      Machine-checkable elements verified separately. No model renders an
      aesthetic verdict.
  - id: comparative-merit
    name: Comparative merit
    points: 40
    scored_by: pairwise-human
    judged: false
    description: >-
      Blinded forced-choice pairwise comparison, same Bayesian Bradley–Terry
      machinery as T1, with tie parameter and non-adaptive pairing.
  - id: direction-craft
    name: Direction & craft evidence
    points: 20
    scored_by: judge
    judged: true
    description: >-
      From the prompt log: iteration structure, use of reference and editing,
      quota efficiency, whether revisions were diagnostic or random.
  - id: provenance-disclosure
    name: Provenance & disclosure hygiene
    points: 10
    scored_by: gates
    judged: false
    description: >-
      Content Credentials intact on delivered assets, correct disclosure
      statement, correct attribution of any reference material.
band_anchors:
  - band: distinction
    min_scaled: 70
    anchor: >-
      Blind panel reads the intended message unaided; wins clear majority of
      pairwise comparisons; prompt log shows diagnostic, quota-efficient
      iteration; credentials and disclosure impeccable.
  - band: merit
    min_scaled: 61
    anchor: >-
      Panel reading mostly matches intent; above-median comparative standing;
      purposeful iteration with some wasted quota; disclosure correct.
  - band: pass
    min_scaled: 50
    anchor: >-
      Partial communicative match; median standing; iteration present but
      partly random; minor provenance or disclosure lapses.
  - band: participation
    min_scaled: 0
    anchor: >-
      Set delivered within quota; panel reading diverges from brief; diagnostic
      report issued.
