# PUBLIC RELEASED-PRACTICE TIER — the opposite of secure.
#
# Every item in this package publishes its `key`, `rationale` and
# `provenance` ON PURPOSE (spec §09 released tier). It exists so the static
# GitHub Pages demo can run a real T2 deck WITHOUT the operational bank.
# It issues NO SCORE OF RECORD.
#
# `redacted: true` is the other half of that bargain and it is ENFORCED, not
# documented: the loader refuses this package if any rubric.yaml grows a
# criterion `description` or a `band_anchors` block, or if any track grows a
# `prompts/` directory. Keys are published here; a MARK SCHEME never is.
# Every file below is its own bytes — this tier no longer symlinks into an
# operational instrument, because there is no operational instrument in this
# repository to link to. See README.md.
