# T2 · Authenticity Discrimination — spec §T2
plugin: "item-bank@2"
config:
  session_minutes: 50
  response_mode: binary-plus-confidence   # two-level confidence tap
  # `bank_items` is how many items THIS package's bank holds in the block,
  # across all locales. It is a fact about the bank, checked at instrument
  # load; an item added or retired without moving the number refuses the load.
  # It used to be a full-length form nothing dealt (6 blocks, 132 items,
  # against a bank of 84). The form the rotation is authoring towards belongs
  # in docs/ROTATION.md, not here: a target and a fact in one field is how the
  # two spent a release disagreeing.
  blocks:
    - { id: media-image,   bank_items:  8, exposure_seconds: 6,  response: binary+confidence }
    - { id: media-video,   bank_items:  0, exposure_seconds: 12, response: binary+confidence }
    - { id: media-audio,   bank_items:  0, exposure_seconds: 10, response: binary+confidence }
    - { id: message-email, bank_items:  4, exposure_seconds: 25, response: binary+confidence }
    - { id: message-page,  bank_items:  4, exposure_seconds: 25, response: binary+confidence }
    - { id: provenance,    bank_items:  4, exposure_seconds: null, response: structured-selection+short-text, untimed: true }
  # What ONE sitting is dealt, and the only statement of it: @ailx/track-t2's
  # sampler is checked against these numbers at load. A locale that cannot
  # supply a stratum deals fewer items rather than an unbalanced deck.
  deck:
    media_pairs: 1     # one signal + one authentic, difficulty-matched
    text: 2            # one signal + one benign
    provenance: 2
  scoring:
    sensitivity_model: signal-detection    # d' = z(H) − z(F)
    correction: log-linear                 # +0.5 to every cell, applied to EVERY candidate
    criterion_reported_not_scored: true    # c = −[z(H)+z(F)]/2 diagnostic only
    calibration_metric: brier
  item_sourcing:
    tier_a_generated: 0.75
    tier_b_licensed: 0.18
    tier_c_authored: 0.07
    hard_rule: "Zero identifiable real public figures, in any item, in any language."
  demo_bank: items/bank.jsonl              # self-contained demo bank for the static showcase
