# T2 · Authenticity Discrimination — spec §T2
plugin: "item-bank@2"
config:
  session_minutes: 50
  response_mode: binary-plus-confidence   # two-level confidence tap
  blocks:
    - { id: media-image,   items: 36, split: "18 synthetic / 18 authentic", exposure_seconds: 6,  response: binary+confidence }
    - { id: media-video,   items: 14, split: "7 / 7",                       exposure_seconds: 12, response: binary+confidence }
    - { id: media-audio,   items: 10, split: "5 / 5",                       exposure_seconds: 10, response: binary+confidence }
    - { id: message-email, items: 40, split: "20 hostile / 20 legitimate",  exposure_seconds: 25, response: binary+confidence }
    - { id: message-page,  items: 20, split: "10 / 10",                     exposure_seconds: 25, response: binary+confidence }
    - { id: provenance,    items: 12, split: null, exposure_seconds: null,  response: structured-selection+short-text, untimed: true }
  scoring:
    sensitivity_model: signal-detection    # d' = z(H) − z(F)
    correction: log-linear                 # +0.5 to every cell, applied to EVERY candidate
    criterion_reported_not_scored: true    # c = −[z(H)+z(F)]/2 diagnostic only
    calibration_metric: brier
  item_sourcing:
    tier_a_generated: 0.75
    tier_b_licensed: 0.18
    tier_c_authored: 0.07
    hard_rule: "Zero identifiable real public figures, in any item, in any language."
  demo_bank: items/bank.jsonl              # self-contained demo bank for the static showcase
