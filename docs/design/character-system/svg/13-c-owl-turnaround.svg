<text x="1280.0" y="422" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="bold" fill="#2B2A28">scale: loupe and chair</text>
<text x="30" y="450" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#2B2A28">Head: circle, radius 52, centre 46 above the neck pivot. Figure is 2.5 H tall. Tufts add 14.</text>
<text x="30" y="466" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#2B2A28">Facial disc: two ovals 54 x 62 in the face color, 19 either side of centre. Eyes: circles radius 12 on the disc, 19 either side.</text>
<text x="30" y="482" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#2B2A28">Beak: one fixed wedge 14 wide, 16 tall, below the eye line. It does not open.</text>
<text x="30" y="498" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#2B2A28">Body: one egg 154 wide, 150 tall. Belly oval 104 x 120 in the face color. Apron trapezoid 68 to 92 wide. Scarf: one band plus one tail.</text>
<text x="30" y="514" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#2B2A28">Wings: the shared teardrop at 0.85 scale, shoulders 52 either side of centre. Legs and feet shared with cycle 1.</text>
<text x="30" y="530" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#2B2A28">Materials: painted wood, matte. Scarf and apron are folded paper. Beak and feet are slate-painted wood. Eyes ink with one highlight.</text>
</svg>
