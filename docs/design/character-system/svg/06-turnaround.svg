<text x="30" y="450" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#2B2A28">Materials: plumage is matte painted wood. Vest is folded paper with one crease at the pocket.</text>
<text x="30" y="466" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#2B2A28">Beak and feet are slate-painted wood, matte. Eyes are ink, no highlight. Contour is charcoal, 3.2 units at this scale.</text>
<text x="30" y="482" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#2B2A28">Construction: head ellipse 100 x 92 in head units, scaled 1.15 about the neck pivot 42 below its centre. Body is one egg 144 wide, 142 tall.</text>
<text x="30" y="498" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#2B2A28">Wings pivot at the shoulder, 44 either side of centre, 32 below the neck. Legs 8 wide, 22 tall. Feet 62 wide wedges.</text>
</svg>
