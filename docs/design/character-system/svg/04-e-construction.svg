<text x="264" y="166.52" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#7F6EA6">0.56  beak base</text>
<line x1="60" y1="204.0" x2="260" y2="204.0" stroke="#7F6EA6" stroke-width="1" stroke-dasharray="3 3"/>
<text x="264" y="207.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#7F6EA6">1.0  chin</text>
<text x="60" y="300" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#2B2A28">Head: ellipse 100 x 92. Tuft adds 8. Eyes: solid ovals, near 14 x 18, far 10 x 18.</text>
<text x="60" y="316" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#2B2A28">Near eye sits 16 right of centre, far eye 24 left. Brows: 18-long strokes, 18 above the eye line.</text>
<text x="60" y="332" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#2B2A28">Beak base is 36 right of centre. Upper wedge 62 long, fixed. Lower wedge 58 long, opens up to 24 degrees.</text>
<g transform="translate(560,120)">
<circle cx="0" cy="0" r="4" fill="#7F6EA6"/>
<text x="8" y="-6" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#7F6EA6">shoulder pivot</text>
<g transform="rotate(0.00 0.0 0.0) scale(1,1)"><path d="M0,0 C16,6 26,40 18,66 C14,80 -6,80 -10,66 C-16,40 -10,10 0,0 Z" fill="#D3A045" stroke="#2B2A28" stroke-width="3.2" stroke-linejoin="round"/><path d="M-4,60 L-2,72 M6,62 L8,74" stroke="#2B2A28" stroke-width="2.2399999999999998" stroke-linecap="round"/></g>
