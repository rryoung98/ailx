<g transform="translate(140,0)" opacity="0.5"><g transform="rotate(-150.00 0.0 0.0) scale(1,1)"><path d="M0,0 C16,6 26,40 18,66 C14,80 -6,80 -10,66 C-16,40 -10,10 0,0 Z" fill="#D3A045" stroke="#2B2A28" stroke-width="3.2" stroke-linejoin="round"/><path d="M-4,60 L-2,72 M6,62 L8,74" stroke="#2B2A28" stroke-width="2.2399999999999998" stroke-linecap="round"/></g></g>
</g>
<text x="560" y="230" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#2B2A28">Wing: one teardrop 36 x 80, pivots at the shoulder. Two short primaries.</text>
<text x="560" y="246" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#2B2A28">No thumb. Grip is the tip curling around an object. Range 0 to 150 degrees.</text>
<g transform="translate(560,300)">
<rect x="20" y="-30" width="8" height="22" fill="#4B4F63" stroke="#2B2A28" stroke-width="3.2"/>
<polygon points="-8,0 54,0 26,-14" fill="#4B4F63" stroke="#2B2A28" stroke-width="3.2" stroke-linejoin="round"/>
</g>
<text x="640" y="296" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#2B2A28">Foot: one wedge 62 wide, 14 tall, no toes drawn. Leg 8 wide.</text>
<text x="640" y="312" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#2B2A28">Feet splay outward in front and three-quarter views.</text>
</svg>
